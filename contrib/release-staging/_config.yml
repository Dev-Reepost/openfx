# Jekyll configuration for the {{SUITE_NAME}} GitHub Pages site.
# Theme: just-the-docs (technical documentation, sidebar nav, search).
#
# This config assumes the site is served from the /docs folder of the repo
# and built by GitHub Actions. To switch to a different hosting setup, see:
#   - https://just-the-docs.com/docs/configuration/

title: "{{SUITE_NAME}}"
description: >-
  OpenFX plugins bridging ComfyUI AI models into any OFX-compatible
  compositor, editor, or color grading tool.

# The base URL the site is served from. Override with the actual repo path
# at deploy time, e.g. "/{{SUITE_NAME}}".
baseurl: ""
url: "https://{{ORG}}.github.io"

repository: "{{ORG}}/{{REPO}}"

# Source content lives in /docs (this repo layout).
source: docs

# Use just-the-docs as the remote theme for GitHub Pages compatibility.
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

# just-the-docs configuration.
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

# Color scheme. just-the-docs ships "light" and "dark"; flip to "dark" if
# preferred.
color_scheme: light

# Footer.
footer_content: >-
  Plugin code is BSD-3-Clause. Model weights are subject to their upstream
  licenses; see each plugin page. Images from upstream model authors are
  reproduced for documentation purposes under applicable fair-use /
  fair-dealing provisions with attribution; see the
  <a href="/{{site.baseurl}}/assets/credits/">credits page</a>. Supported by
  CNC (Centre national du cinéma et de l'image animée).

# Aux links in the top-right corner of the navigation bar.
aux_links:
  "GitHub":
    - "https://github.com/{{ORG}}/{{REPO}}"

# Heading anchors for in-page sectioning.
heading_anchors: true

# Show generation timestamp in the footer.
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"

# Exclude these paths from the build.
exclude:
  - _research/
  - RELEASE_SPEC.md
  - MIGRATION.md
  - CHANGELOG.md
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - LICENSE
  - README.md
  - vendor/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - script/
